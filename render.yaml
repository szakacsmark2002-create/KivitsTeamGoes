services:
  - type: web
    name: kivits-goes-uren-online
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Amsterdam
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: ADMIN_ID
        value: Mark001
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
    disk:
      name: kivits-data
      mountPath: /data
      sizeGB: 5
